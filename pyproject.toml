[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lithe-cli"
dynamic = ["version"]
description = "Command-line interface for the lithe agent kernel: chat, one-shot runs, undo, and run inspection."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["lithe>=0.9.17", "prompt-toolkit>=3.0.38", "textual>=1.0"]
keywords = ["agent", "llm", "react", "cli", "tool-calling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
lithe = "lithe_cli.main:main"
lithe-cli = "lithe_cli.main:main"

[tool.setuptools.dynamic]
# Single source of truth: the literal in lithe_cli/__init__.py.
version = { attr = "lithe_cli.__version__" }

[tool.setuptools.packages.find]
include = ["lithe_cli*"]

[tool.setuptools.package-data]
lithe_cli = ["py.typed"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
